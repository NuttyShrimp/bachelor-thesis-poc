name: Swift CI & Docker Build

on:
  push:
    paths:
      - 'swift/**'
      - '.github/workflows/swift.yml'
  pull_request:
    paths:
      - 'swift/**'
      - '.github/workflows/swift.yml'

jobs:
  validate:
    name: Validate Swift Code
    runs-on: ubuntu-latest
    container: swift:6.3.1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Cache Swift Build
        uses: actions/cache@v5
        with:
          path: swift/.build
          key: ${{ runner.os }}-swift-${{ hashFiles('swift/Package.resolved') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-swift-${{ hashFiles('swift/Package.resolved') }}-${{ github.run_id }}-
            ${{ runner.os }}-swift-${{ hashFiles('swift/Package.resolved') }}-
            ${{ runner.os }}-swift-

      - name: Resolve Dependencies
        run: swift package --package-path swift resolve

      - name: Build Code (Standard)
        run: swift build --package-path swift

      - name: Build Code (ReerJSON)
        run: swift build --package-path swift --traits ReerJSON

  build-docker:
    name: Build Swift Docker Images
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: swift
            build_args: ""
            image_name: swift
          - name: swift-reerjson
            build_args: "SWIFT_BUILD_FLAGS=--traits ReerJSON"
            image_name: swift-reerjson

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bap-${{ matrix.image_name }}

      - name: Build and Push Swift Image
        uses: docker/build-push-action@v7
        with:
          context: swift
          file: swift/Dockerfile
          build-args: ${{ matrix.build_args }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}
