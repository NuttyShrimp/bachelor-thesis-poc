name: PHP CI & Docker Build

on:
  push:
    paths:
      - 'php/**'
      - '.github/workflows/php.yml'
  pull_request:
    paths:
      - 'php/**'
      - '.github/workflows/php.yml'

jobs:
  validate-php:
    name: Validate PHP Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict
        working-directory: php

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
        working-directory: php

      - name: Cache Composer Dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('php/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist
        working-directory: php

      - name: Copy Env File
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
        working-directory: php

      - name: Generate Application Key
        run: php artisan key:generate
        working-directory: php

  validate-frontend:
    name: Validate Frontend Assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: php/package-lock.json

      - name: Install Node Dependencies
        run: npm ci
        working-directory: php

      - name: Build Frontend Assets
        run: npm run build
        working-directory: php

  build-docker:
    name: Build PHP Docker Images
    needs: [validate-php, validate-frontend]
    runs-on: ubuntu-latest
    permissions:
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: php-fpm
            file: php/Dockerfile
            target: app
            image_name: php-fpm
          - name: php-nginx
            file: php/Dockerfile
            target: web
            image_name: php-nginx
          - name: php-octane
            file: php/Dockerfile.octane
            target: octane
            image_name: php-octane

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/bap-${{ matrix.image_name }}

      - name: Build and Push Image
        uses: docker/build-push-action@v7
        with:
          context: php
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
