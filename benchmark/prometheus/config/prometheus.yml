global:
  # scrape_interval: 350ms
  scrape_interval: 1s
  # Interval at which rules are evaluated, default 1m
  evaluation_interval: 5s

scrape_configs:
- job_name: cadvisor
  metric_relabel_configs:
    - source_labels: ['name']
      target_label: 'container'
    - source_labels: [container_label_monitoring]
      regex: benchmark
      action: keep  # Drop all metrics NOT matching this label
  static_configs:
    - targets:
      - cadvisor:8080
      - 192.168.0.121:4041
